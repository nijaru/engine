[package]
name = "ribn-text"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cuda = ["dep:engine-qwen", "engine-qwen/cuda"]

[dependencies]
ribn = { path = "../runtime" }
engine-gguf = { path = "../gguf" }
engine-qwen = { path = "../qwen", optional = true }
flume = { version = "0.12", default-features = false, features = ["async"] }

[lints]
workspace = true
