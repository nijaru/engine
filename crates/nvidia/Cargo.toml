[package]
name = "engine-nvidia"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cuda = ["dep:cudarc", "cudarc/nvrtc"]

[dependencies]
engine-core = { path = "../core" }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "cuda-13020", "cublas", "dynamic-loading"] }

[dev-dependencies]
engine-qwen = { path = "../qwen", default-features = false, features = ["gguf"] }
engine-gguf = { path = "../gguf" }

[[example]]
name = "int_dot_bench"
required-features = ["cuda"]

[[example]]
name = "qwen_decode_bench"
required-features = ["cuda"]

[[example]]
name = "qwen_serving_bench"
required-features = ["cuda"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
