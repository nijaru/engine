[package]
name = "engine-qwen"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["gguf"]
gguf = ["dep:engine-gguf", "dep:sha2", "dep:engine-core"]
cuda = ["dep:ribn", "gguf", "dep:cudarc", "dep:engine-nvidia", "engine-nvidia/cuda"]

[dependencies]
sha2 = { version = "0.11.0", optional = true }
ribn = { path = "../runtime", optional = true }
engine-core = { path = "../core", optional = true }
engine-gguf = { path = "../gguf", optional = true }
engine-nvidia = { path = "../nvidia", optional = true }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "cuda-13020", "cublas", "dynamic-loading"] }

[lints]
workspace = true

[dev-dependencies]
ribn = { path = "../runtime" }
engine-core = { path = "../core" }
