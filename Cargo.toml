[workspace]
members = [
    "crates/core",
    "crates/runtime",
    "crates/qwen",
    "crates/gguf",
    "crates/nvidia",
    "crates/cli",
]
# Hardware-gated CUDA Rust probes: their own workspace, so the toolchain-free
# workspace build and test above stay that way.
exclude = ["cuda-rust-probe"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/nijaru/engine"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
