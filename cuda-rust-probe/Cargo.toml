[workspace]
# Deliberately its own workspace: these crates need the NVIDIA toolchain at
# build time, and `cargo test --workspace` in the repository root must not.
members = ["interop", "tile"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
# This workspace exists to exercise FFI seams across two CUDA libraries, so
# unsafe blocks are the subject rather than a smell. The main repository
# workspace keeps `unsafe_code = "forbid"`.
unsafe_code = "allow"

[workspace.lints.clippy]
all = "warn"
