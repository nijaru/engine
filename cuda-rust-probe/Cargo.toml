[workspace]
# Deliberately its own workspace: these crates need the NVIDIA toolchain at
# build time, and `cargo test --workspace` in the repository root must not.
members = ["interop"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
