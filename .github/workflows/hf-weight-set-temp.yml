name: Temporary HF weight-set migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-weight-set-temp.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Add shard borrowing and migrate BERT loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hf = Path('crates/hf/src/lib.rs')
          text = hf.read_text()
          old = '''    /// Resolve and borrow one parameter tensor, lazily opening its shard once.
    ///
    /// Model integrations remain responsible for interpreting the parameter name,
    /// validating model-specific shape requirements, and preparing backend storage.
    ///
    /// # Errors
    /// Returns [`PackageError::UnknownParameter`] for a name absent from a sharded
    /// index, or an artifact error when the shard/tensor is invalid.
    pub fn tensor(&mut self, parameter: &str) -> Result<ArtifactTensor<'_>, PackageError> {
        let path = self
            .weight_path(parameter)
            .ok_or_else(|| PackageError::UnknownParameter(parameter.to_owned()))?
            .to_owned();
        if !self.artifacts.contains_key(&path) {
            self.artifacts.insert(path.clone(), open_artifact(&path)?);
        }
        self.artifacts
            .get(&path)
            .expect("opened artifact remains owned by the weight set")
            .tensor(parameter)
            .map_err(|error| PackageError::Artifact {
                path,
                message: error.to_string(),
            })
    }

    fn weight_path(&self, parameter: &str) -> Option<&Path> {
        match self.weights {
            Weights::Single(path) => Some(path),
            Weights::Sharded { weight_map, .. } => {
                weight_map.get(parameter).map(PathBuf::as_path)
            }
        }
    }
'''
          new = '''    /// Resolve and borrow the SafeTensors artifact containing one parameter.
    ///
    /// This exposes format-level access for model integrations that need to try
    /// architecture-specific parameter aliases while keeping shard ownership and
    /// reuse in the package layer.
    ///
    /// # Errors
    /// Returns [`PackageError::UnknownParameter`] for a name absent from a sharded
    /// index, or an artifact error when the resolved shard is invalid.
    pub fn artifact(&mut self, parameter: &str) -> Result<&SafeTensorArtifact, PackageError> {
        let path = self
            .weight_path(parameter)
            .ok_or_else(|| PackageError::UnknownParameter(parameter.to_owned()))?
            .to_owned();
        if let std::collections::btree_map::Entry::Vacant(entry) =
            self.artifacts.entry(path.clone())
        {
            entry.insert(open_artifact(&path)?);
        }
        Ok(self
            .artifacts
            .get(&path)
            .expect("opened artifact remains owned by the weight set"))
    }

    /// Resolve and borrow one parameter tensor, lazily opening its shard once.
    ///
    /// Model integrations remain responsible for interpreting the parameter name,
    /// validating model-specific shape requirements, and preparing backend storage.
    ///
    /// # Errors
    /// Returns [`PackageError::UnknownParameter`] for a name absent from a sharded
    /// index, or an artifact error when the shard/tensor is invalid.
    pub fn tensor(&mut self, parameter: &str) -> Result<ArtifactTensor<'_>, PackageError> {
        let path = self
            .weight_path(parameter)
            .ok_or_else(|| PackageError::UnknownParameter(parameter.to_owned()))?
            .to_owned();
        self.artifact(parameter)?
            .tensor(parameter)
            .map_err(|error| PackageError::Artifact {
                path,
                message: error.to_string(),
            })
    }

    fn weight_path(&self, parameter: &str) -> Option<&Path> {
        match self.weights {
            Weights::Single(path) => Some(path),
            Weights::Sharded { weight_map, .. } => weight_map.get(parameter).map(PathBuf::as_path),
        }
    }
'''
          if old not in text:
              raise SystemExit('HF LocalWeightSet anchor not found')
          hf.write_text(text.replace(old, new, 1))

          bert = Path('crates/batch/tests/bert_architecture.rs')
          text = bert.read_text()
          text = text.replace('use std::collections::BTreeMap;\n', '', 1)
          text = text.replace(
              'use ribn_hf::LocalModelPackage;\nuse ribn_safetensors::{ArtifactError, SafeTensorArtifact};\n',
              'use ribn_hf::{LocalModelPackage, LocalWeightSet, PackageError};\nuse ribn_safetensors::ArtifactError;\n',
              1,
          )
          start = text.find("struct ArtifactCache<'a> {")
          end = text.find('\nfn decode_f32_tensor(', start)
          if start < 0 or end < 0:
              raise SystemExit('BERT ArtifactCache anchors not found')
          replacement = '''struct ModelWeights<'a> {
    weights: LocalWeightSet<'a>,
}

impl<'a> ModelWeights<'a> {
    fn new(package: &'a LocalModelPackage) -> Self {
        Self {
            weights: package.weight_set(),
        }
    }

    fn load_required(
        &mut self,
        suffix: &str,
        expected_shape: &[usize],
    ) -> Result<Vec<f32>, ModelError> {
        self.load_optional(suffix, expected_shape)?
            .ok_or_else(|| ModelError::MissingParameter(suffix.to_owned()))
    }

    fn load_optional(
        &mut self,
        suffix: &str,
        expected_shape: &[usize],
    ) -> Result<Option<Vec<f32>>, ModelError> {
        for name in [format!("bert.{suffix}"), suffix.to_owned()] {
            let artifact = match self.weights.artifact(&name) {
                Ok(artifact) => artifact,
                Err(PackageError::UnknownParameter(_)) => continue,
                Err(error) => return Err(ModelError::Artifact(error.to_string())),
            };
            let tensor = match artifact.tensor(&name) {
                Ok(tensor) => tensor,
                Err(ArtifactError::MissingTensor(_)) => continue,
                Err(error) => return Err(ModelError::Artifact(error.to_string())),
            };
            return decode_f32_tensor(&name, &tensor, expected_shape).map(Some);
        }
        Ok(None)
    }

    fn artifact_count(&self) -> usize {
        self.weights.opened_shard_count()
    }
}
'''
          text = text[:start] + replacement + text[end:]
          text = text.replace("ArtifactCache<'_>", "ModelWeights<'_>")
          text = text.replace('let mut cache = ArtifactCache::new(package);', 'let mut cache = ModelWeights::new(package);', 1)
          if 'ArtifactCache' in text or 'SafeTensorArtifact' in text or 'BTreeMap' in text:
              raise SystemExit('private BERT shard cache was not fully removed')
          bert.write_text(text)
          PY
          cargo fmt --all
      - name: Validate migrated loading path
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ribn-hf --locked
          cargo clippy -p ribn-hf --all-targets --locked -- -D warnings
          cargo test -p ribn-batch --test bert_architecture --locked
          cargo clippy -p ribn-batch --test bert_architecture --locked -- -D warnings
      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nick'
          git config user.email 'nijaru7@gmail.com'
          git add crates/hf/src/lib.rs crates/batch/tests/bert_architecture.rs
          git commit -m 'Reuse resolved SafeTensors shards across model loading'
          git push origin HEAD:main
