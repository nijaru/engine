name: Temporary Qwen prefill chunk validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qwen-prefill-chunk-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply experimental prefill chunk path
        run: |
          python3 tools/temp_qwen_prefill_chunk.py
          cargo fmt --all
      - name: Validate CUDA source and reference test
        run: |
          set -euo pipefail
          cargo test -p engine-nvidia --features cuda --locked
          cargo clippy -p engine-nvidia --features cuda --all-targets --locked -- -D warnings
      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'Nick'
          git config user.email 'nijaru7@gmail.com'
          git add crates/nvidia/src/decode.rs crates/nvidia/tests/cuda_reference.rs
          git commit -m 'Add experimental multi-token Qwen prefill path'
          git push origin HEAD:main
