name: Temporary HF weight-set migration v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-weight-set-v3-temp.yml
      - tools/temp_hf_weight_set_migration.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply migration
        run: |
          python3 tools/temp_hf_weight_set_migration.py
          cargo fmt --all
      - name: Validate migrated loading path
        run: |
          set -euo pipefail
          cargo test -p ribn-hf --locked
          cargo clippy -p ribn-hf --all-targets --locked -- -D warnings
          cargo test -p ribn-batch --test bert_architecture --locked
          cargo clippy -p ribn-batch --test bert_architecture --locked -- -D warnings
      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'Nick'
          git config user.email 'nijaru7@gmail.com'
          git add crates/hf/src/lib.rs crates/batch/tests/bert_architecture.rs
          git commit -m 'Reuse resolved SafeTensors shards across model loading'
          git push origin HEAD:main
