name: Temporary BERT fixture validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-bert-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Fix BERT fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/batch/tests/bert_architecture.rs')
          text = path.read_text()
          old_variant = '    Package(String),\n'
          old_display = '            Self::Package(message) => write!(formatter, "model package error: {message}"),\n'
          old_header = '            r#"\\\\\"{}\\\\\":{{\\\\\"dtype\\\\\":\\\\\"F32\\\\\",\\\\\"shape\\\\\":[{}],\\\\\"data_offsets\\\\\":[{},{}]}}"#,\n'
          if old_variant not in text or old_display not in text:
              raise SystemExit('BERT error variant anchors not found')
          text = text.replace(old_variant, '', 1).replace(old_display, '', 1)
          # Match the source form directly if Python escaping above differs.
          source_header = '            r#"\\\"{}\\\":{{\\\"dtype\\\":\\\"F32\\\",\\\"shape\\\":[{}],\\\"data_offsets\\\":[{},{}]}}"#,\n'
          if source_header not in text:
              raise SystemExit('SafeTensors header anchor not found')
          replacement = '            "\\\"{}\\\":{{\\\"dtype\\\":\\\"F32\\\",\\\"shape\\\":[{}],\\\"data_offsets\\\":[{},{}]}}",\n'
          path.write_text(text.replace(source_header, replacement, 1))
          PY
          cargo fmt --all
      - name: Validate BERT pressure test
        run: |
          set -euo pipefail
          cargo test -p ribn-batch --test bert_architecture --locked
          cargo clippy -p ribn-batch --test bert_architecture --locked -- -D warnings
      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name 'Nick'
          git config user.email 'nijaru7@gmail.com'
          git add crates/batch/tests/bert_architecture.rs
          git commit -m 'Fix BERT SafeTensors pressure-test fixture'
          git push origin HEAD:main
