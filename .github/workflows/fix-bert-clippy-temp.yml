name: Temporary BERT Clippy validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-bert-clippy-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply BERT fixture and Clippy fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/batch/tests/bert_architecture.rs')
          text = path.read_text()

          for old in [
              '    Package(String),\n',
              '            Self::Package(message) => write!(formatter, "model package error: {message}"),\n',
          ]:
              if old not in text:
                  raise SystemExit(f'missing BERT anchor: {old!r}')
              text = text.replace(old, '', 1)

          source_header = '            r#"\\\"{}\\\":{{\\\"dtype\\\":\\\"F32\\\",\\\"shape\\\":[{}],\\\"data_offsets\\\":[{},{}]}}"#,\n'
          replacement = '            "\\\"{}\\\":{{\\\"dtype\\\":\\\"F32\\\",\\\"shape\\\":[{}],\\\"data_offsets\\\":[{},{}]}}",\n'
          if source_header not in text:
              raise SystemExit('SafeTensors header anchor not found')
          text = text.replace(source_header, replacement, 1)

          pattern = re.compile(
              r'config\s*\.get\("([^"]+)"\)\s*\.and_then\(\|value\| value\.as_(str|bool|u64|f64)\(\)\)'
          )
          text, count = pattern.subn(lambda match: f'config["{match.group(1)}"].as_{match.group(2)}()', text)
          if count < 10:
              raise SystemExit(f'expected config accessor cleanups, found {count}')

          old_div = 'self.hidden_size % self.num_attention_heads != 0'
          new_div = '!self.hidden_size.is_multiple_of(self.num_attention_heads)'
          if old_div not in text:
              raise SystemExit('attention divisibility anchor not found')
          text = text.replace(old_div, new_div, 1)

          fixture = 'fn bert_fixture_tensors() -> Vec<TensorFixture> {'
          if fixture not in text:
              raise SystemExit('fixture function anchor not found')
          text = text.replace(
              fixture,
              '#[allow(clippy::too_many_lines)]\n' + fixture,
              1,
          )

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Validate BERT pressure test
        run: |
          set -euo pipefail
          cargo test -p ribn-batch --test bert_architecture --locked
          cargo clippy -p ribn-batch --test bert_architecture --locked -- -D warnings
      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name 'Nick'
          git config user.email 'nijaru7@gmail.com'
          git add crates/batch/tests/bert_architecture.rs
          git commit -m 'Validate BERT architecture pressure test'
          git push origin HEAD:main
