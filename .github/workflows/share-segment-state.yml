name: Share Segment State Requirements

# one-shot migration; removed on success
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/share-segment-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Share prepared state requirements
        run: python .github/share-segment-state.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: NVIDIA CUDA feature clippy
        run: cargo clippy -p engine-nvidia --features cuda --all-targets -- -D warnings
      - name: Server CUDA feature clippy
        run: cargo clippy -p engine-server --features cuda --all-targets -- -D warnings
      - name: Commit changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/share-segment-state.py .github/workflows/share-segment-state.yml
          git add crates/core
          git commit -m "Share prepared state requirements across serving segments"
          git push origin HEAD:main
