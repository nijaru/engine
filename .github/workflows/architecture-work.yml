name: Architecture work

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/architecture-work.yml
      - tools/architecture-work.py

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export the exact source under review
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/engine-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-source
          path: ${{ runner.temp }}/engine-source.tar.gz
          retention-days: 1
