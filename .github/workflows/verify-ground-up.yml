name: Verify ground-up alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-ground-up.yml
      - .github/ground-up-payload/**

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the exact locally reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma, subprocess
          packed = b''.join(Path(f'.github/ground-up-payload/{i}').read_bytes() for i in range(4))
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '308e2277a7707d0bbc458938701f743f19b78ad5d7b182fe98632782293ca7ad'
          Path('/tmp/ground-up.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', '/tmp/ground-up.patch'], check=True)
          subprocess.run(['git', 'apply', '--index', '/tmp/ground-up.patch'], check=True)
          PY
          git rm -r -- .github/ground-up-payload .github/workflows/verify-ground-up.yml
          test "$(git write-tree)" = 29711ff2570d68c48d4fb352a47737bc99a360aa
          git diff --cached --check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: python3 tools/check-boundaries.py
      - run: cargo fmt --all -- --check
      - run: cargo test -p engine-qwen --no-default-features --test model_config --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p engine-nvidia -p engine-qwen -p ribn-cli --features cuda --all-targets --locked -- -D warnings
      - run: cargo test -p engine-qwen -p ribn-cli --features cuda --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Store verified Git objects without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = 29711ff2570d68c48d4fb352a47737bc99a360aa
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          def post(endpoint, data):
              request = urllib.request.Request(
                  'https://api.github.com/repos/nijaru/engine/git/' + endpoint,
                  data=json.dumps(data).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          changes = git('diff', '--cached', '--name-status', '--no-renames', '-z').decode().split('\0')
          entries = []
          for index in range(0, len(changes) - 1, 2):
              status, path = changes[index:index + 2]
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              assert status in ('A', 'M'), (status, path)
              mode, expected = git('ls-files', '--stage', '--', path).decode().split()[:2]
              content = base64.b64encode(git('show', ':' + path)).decode()
              blob = post('blobs', {'content': content, 'encoding': 'base64'})
              assert blob['sha'] == expected, path
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          tree = post('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': entries})
          assert tree['sha'] == '29711ff2570d68c48d4fb352a47737bc99a360aa', tree['sha']
          print('VERIFIED_TREE=' + tree['sha'])
          print('All host checks passed. GPU execution was not performed. No branch was updated.')
          PY
