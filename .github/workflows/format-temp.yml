name: Temporary formatter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Nick'
          git config user.email 'nijaru7@gmail.com'
          git add crates/hf/src/lib.rs crates/batch/tests/hf_package_encoder.rs
          git commit -m 'Format HF package pressure test'
          git push origin HEAD:main
