name: Source snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/engine-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-source
          path: ${{ runner.temp }}/engine-source.tar.gz
          retention-days: 1
