name: Skip Qwen Prefill Output Head

# one-shot migration; removed on success
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/skip-prefill-output.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Add output-free prefill path
        run: python .github/skip-prefill-output.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: NVIDIA CUDA feature clippy
        run: cargo clippy -p engine-nvidia --features cuda --all-targets -- -D warnings
      - name: Server CUDA feature clippy
        run: cargo clippy -p engine-server --features cuda --all-targets -- -D warnings
      - name: Commit changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/skip-prefill-output.py .github/workflows/skip-prefill-output.yml
          git add crates/nvidia
          git commit -m "Skip output head for intermediate Qwen prefill tokens"
          git push origin HEAD:main
