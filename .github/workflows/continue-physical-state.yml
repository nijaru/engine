name: Continue Physical CUDA State

# retry after clippy-only test naming fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/continue-physical-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply physical CUDA state integration
        run: python .github/continue_physical_state.py
      - name: Fix test counter names
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/core/src/nvidia.rs')
          s = p.read_text()
          s = s.replace('batch_calls', 'batches')
          s = s.replace('segment_calls', 'segments')
          s = s.replace('release_calls', 'releases')
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CUDA feature clippy
        run: cargo clippy -p engine-nvidia --features cuda --all-targets -- -D warnings
      - name: Commit changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/continue_physical_state.py .github/workflows/continue-physical-state.yml
          git add crates
          git commit -m "Persist CUDA inference state across serving steps"
          git push origin HEAD:main
