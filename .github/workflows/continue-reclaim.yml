name: Continue Logical State Reclamation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/continue-reclaim.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply logical state reclamation
        run: python .github/continue_reclaim.py
      - name: Fix serving error mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/core/src/serving_runtime.rs')
          s = p.read_text()
          s = s.replace(
              '        let state = reclaimed.take_terminal_state()?;\n        self.runtime.release_state_set(&state)?;',
              '        let state = reclaimed\n            .take_terminal_state()\n            .map_err(SchedulerError::from)?;\n        self.runtime\n            .release_state_set(&state)\n            .map_err(ServingRuntimeError::Runtime)?;',
              1,
          )
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CUDA feature clippy
        run: cargo clippy -p engine-nvidia --features cuda --all-targets -- -D warnings
      - name: Commit changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/continue_reclaim.py .github/workflows/continue-reclaim.yml
          git add crates
          git commit -m "Release logical inference state on request reclamation"
          git push origin HEAD:main
