name: Temporary validation-doc update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-validation-docs-temp.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply evidence updates
        run: |
          python3 tools/temp_update_validation_docs.py
          cargo fmt --all
      - name: Validate docs and formatting
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo doc --workspace --no-deps --locked
      - name: Commit evidence updates
        run: |
          set -euo pipefail
          git config user.name 'Nick'
          git config user.email 'nijaru7@gmail.com'
          git add AGENTS.md docs/execution-foundation.md docs/roadmap.md crates/nvidia/src/decode.rs
          git commit -m 'Record current architecture pressure-test evidence'
          git push origin HEAD:main
