name: Temporary lock refresh

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - crates/safetensors/**
      - .github/workflows/lock-refresh-temp.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - run: cargo check -p ribn-safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-cargo-lock
          path: Cargo.lock
          retention-days: 1
